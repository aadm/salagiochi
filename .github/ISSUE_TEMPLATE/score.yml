name: Invia Punteggio
description: Segnala un punteggio con la foto o lo screenshot come prova.
title: "[PUNTEGGIO] <GIOCO> - <GIOCATORE>: <PUNTEGGIO>"
body:
  - type: input
    id: game
    attributes:
      label: Gioco
      description: Nome del gioco, es. Mario Bros
    validations:
      required: true
  - type: input
    id: score
    attributes:
      label: Punteggio
      description: Solo numeri, es. 120000
    validations:
      required: true
  - type: input
    id: player
    attributes:
      label: Giocatore
      description: strmnk oppure anal
    validations:
      required: true
  - type: textarea
    id: proof
    attributes:
      label: Foto / Screenshot
      description: Trascina qui la foto dello schermo come prova
  - type: textarea
    id: note
    attributes:
      label: Nota (opzionale)